services:
  postgres:
    image: postgres:16-alpine
    container_name: rts-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rts
      POSTGRES_USER: rts
      POSTGRES_PASSWORD: rts_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rts -d rts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
